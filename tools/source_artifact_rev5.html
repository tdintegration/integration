<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toscana Diagnostica - Integration Plan Management</title>
<style id="td-style">
/* TD Integration Hub - stile brand Toscana Diagnostica */
:root {
  --jet: #01212C; --teal: #1C505E; --pacific: #71B1BD; --canary: #F7F052; --cornsilk: #FFFAE3;
  --ink: #12333E; --ink-2: #48656F; --ink-3: #7B929A; --paper: #FCFCFB; --card: #fff; --line: #E2E8EA;
  --good: #2E7D32; --warn: #B26A00; --crit: #B3261E;
  --c-gov: #1C505E; --c-reg: #7E57C2; --c-hr: #B08718; --c-it: #0E7FA0; --c-fin: #01212C;
  --c-proc: #2E7D32; --c-cli: #B3261E; --c-mkt: #C2185B; --c-ops: #45AFD4;
  --radius: 14px; --shadow: 0 1px 2px rgba(1,33,44,.06), 0 8px 24px rgba(1,33,44,.07);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 14.5px/1.5 "Inter Tight", "Segoe UI", -apple-system, Arial, sans-serif; }
/* ---------- header ---------- */
.hero { background: radial-gradient(900px 380px at 85% -50%, rgba(113,177,189,.22), transparent 60%),
  linear-gradient(150deg, #000 0%, var(--jet) 55%, #06303f 100%);
  color: #fff; padding: 26px 26px 20px; position: relative; }
.hero::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--canary); }
.hero .brand { display: flex; align-items: center; gap: 12px; }
.hero .logo { height: 36px; }
.hero .bn { font-weight: 750; letter-spacing: .13em; font-size: 13px; }
.hero h1 { margin: 10px 0 4px; font-size: 24px; font-weight: 760; }
.hero h1 .hl { background: var(--canary); color: var(--jet); padding: 0 8px; border-radius: 3px; }
.hero .sub { opacity: .82; font-size: 13px; }
.topbar { position: absolute; top: 14px; right: 16px; display: flex; gap: 6px; align-items: center; }
.topbar button { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.35);
  border-radius: 8px; padding: 4px 11px; cursor: pointer; font-size: 12.5px; font-weight: 650; font-family: inherit; }
.topbar button.on { background: var(--canary); color: var(--jet); border-color: var(--canary); }
/* ---------- nav ---------- */
.nav { position: sticky; top: 0; z-index: 60; background: var(--paper); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; overflow-x: auto; align-items: center; }
.nav button { border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-weight: 680;
  padding: 6px 13px; border-radius: 999px; cursor: pointer; font-size: 12.5px; font-family: inherit; white-space: nowrap; }
.nav button.on { background: var(--jet); color: var(--canary); border-color: var(--jet); }
.nav .sp { flex: 1; }
main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 60px; }
/* ---------- cards, tiles ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 15px 17px; margin-bottom: 14px; }
.card h3 { margin: 0 0 8px; font-size: 15px; color: var(--teal); }
.card .note { font-size: 11.5px; color: var(--ink-3); }
.grid { display: grid; gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; }
.tile .lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.tile .val { font-size: 20px; font-weight: 780; color: var(--jet); }
.tile .sub { font-size: 11px; color: var(--ink-2); }
.tile.dark { background: var(--jet); border-color: var(--jet); }
.tile.dark .val { color: var(--canary); } .tile.dark .lab, .tile.dark .sub { color: #9FB6BE; }
/* target cards in copertina */
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 13px; }
.tcard { background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--teal);
  border-radius: 12px; padding: 13px 15px; cursor: pointer; box-shadow: var(--shadow); }
.tcard:hover { border-left-color: var(--canary); }
.tcard .tn { font-size: 16.5px; font-weight: 780; color: var(--jet); }
.tcard .ti { font-size: 12px; color: var(--ink-2); margin: 3px 0 8px; min-height: 16px; }
.pbar { height: 8px; border-radius: 5px; background: #EDF1F2; overflow: hidden; }
.pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pacific), var(--teal)); }
.tcard .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 6px; }
/* ---------- form ---------- */
.frm { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 9px; }
.fld label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-3); margin-bottom: 2px; font-weight: 700; }
.fld input, .fld select, .fld textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px;
  padding: 7px 9px; font: inherit; color: #0000EE; font-weight: 650; background: #fff; }
.fld input:focus { outline: 2px solid var(--pacific); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip { border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  font-size: 12px; font-weight: 700; color: var(--ink-2); background: #fff; user-select: none; }
.chips .chip.on { background: var(--jet); color: var(--canary); border-color: var(--jet); }
.opbox { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.opbox .fld { min-width: 170px; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 750; }
.badge.canary { background: var(--canary); color: var(--jet); }
.badge.info { background: #E5EFF3; color: var(--teal); }
.badge.warn { background: #FFF3E0; color: var(--warn); }
.badge.crit { background: #FBE9E7; color: var(--crit); }
.badge.good { background: #E8F5E9; color: var(--good); }
.btn { border: 1px solid var(--jet); background: var(--jet); color: #fff; border-radius: 9px;
  padding: 7px 13px; font-weight: 700; font-size: 12.5px; cursor: pointer; font-family: inherit; }
.btn.ghost { background: #fff; color: var(--jet); }
.btn.canary { background: var(--canary); color: var(--jet); border-color: var(--canary); }
.btn.mini { padding: 3px 9px; font-size: 11.5px; border-radius: 7px; }
.btn.danger { background: #fff; color: var(--crit); border-color: var(--crit); }
/* ---------- gantt ---------- */
.gwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
table.gantt { border-collapse: collapse; font-size: 12px; min-width: 100%; }
.gantt th, .gantt td { border-bottom: 1px solid #EDF1F2; border-right: 1px solid #F3F6F7; padding: 0; }
.gantt thead th { background: var(--jet); color: #fff; font-size: 10px; padding: 5px 4px; position: sticky; top: 0; z-index: 5; }
.gantt thead th .wd { color: var(--pacific); font-weight: 400; display: block; font-size: 9px; }
.gantt thead th.m100 { background: var(--teal); }
.gantt .actcol { position: sticky; left: 0; background: #fff; z-index: 4; min-width: 320px; max-width: 360px;
  padding: 6px 9px; border-right: 2px solid var(--line); }
.gantt thead .actcol { background: var(--jet); z-index: 6; text-align: left; font-size: 11px; }
.gantt .actcol .an { font-weight: 700; font-size: 12px; color: var(--jet); cursor: pointer; }
.gantt .actcol .ao { font-size: 10.5px; color: var(--teal); font-weight: 650; }
.gantt .actcol .ad { font-size: 10px; color: var(--ink-3); }
.gantt td.wk { width: 34px; min-width: 34px; height: 34px; cursor: pointer; position: relative; }
.gantt td.wk:hover { outline: 2px solid var(--pacific); outline-offset: -2px; }
.gantt td.wk.fill { border-radius: 0; }
.gantt td.wk.start { border-radius: 8px 0 0 8px; }
.gantt td.wk.end { border-radius: 0 8px 8px 0; }
.gantt td.wk.startend { border-radius: 8px; }
.gantt td.wk .ms { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--jet); font-size: 15px; }
.gantt tr.done .actcol .an { text-decoration: line-through; color: var(--ink-3); }
.gantt tbody tr:hover .actcol { background: #F7FAFA; }
.stato { font-size: 10px; border-radius: 6px; padding: 1px 6px; font-weight: 750; display: inline-block; }
.st0 { background: #EDF1F2; color: var(--ink-2); } .st1 { background: #E5EFF3; color: var(--teal); }
.st2 { background: #E8F5E9; color: var(--good); } .st3 { background: #FBE9E7; color: var(--crit); }
/* editor riga attivita' */
.aedit { background: #F7FAFA; border-top: 2px solid var(--pacific); }
.aedit td { padding: 10px 12px !important; }
.aedit .frm { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
/* tendina multi-scelta ownership support */
details.msdd { position: relative; }
details.msdd summary {
  list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 9px;
  padding: 7px 9px; background: #fff; color: #0000EE; font-weight: 650; font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px;
}
details.msdd summary::after { content: " ▾"; color: var(--ink-3); }
details.msdd[open] summary { border-color: var(--pacific); }
.msdd-list {
  position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; background: #fff;
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 8px; display: flex; flex-wrap: wrap; gap: 5px; width: 340px; max-height: 220px; overflow-y: auto;
}
.msdd-list .chip { border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer;
  font-size: 11.5px; font-weight: 700; color: var(--ink-2); background: #fff; user-select: none; }
.msdd-list .chip.on { background: var(--jet); color: var(--canary); border-color: var(--jet); }
/* catalogo */
.catgrp { margin-bottom: 10px; }
.catgrp .cgh { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  color: var(--teal); margin: 8px 0 4px; }
.catrow { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; font-size: 12.5px; }
.catrow:hover { background: #F2F6F7; }
.catrow .dot { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 9px; }
.catrow .cn { flex: 1; }
.catrow.used { opacity: .45; }
.catrow.used .cn { text-decoration: line-through; }
/* legenda processi */
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--ink-2); margin: 8px 2px; }
.legend .it { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; }
/* alert */
.alerts li { margin-bottom: 5px; font-size: 12.5px; }
/* workload */
table.wl { border-collapse: collapse; font-size: 12px; width: 100%; }
.wl th, .wl td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: right; }
.wl th { background: #F2F6F7; color: var(--teal); font-size: 10.5px; text-transform: uppercase; }
.wl td:first-child, .wl th:first-child { text-align: left; }
/* modal stampa */
.modal { position: fixed; inset: 0; background: rgba(1,33,44,.45); display: none; z-index: 100;
  align-items: center; justify-content: center; }
.modal.show { display: flex; }
.mbox { background: #fff; border-radius: 14px; padding: 20px 22px; width: min(480px, 92vw); box-shadow: var(--shadow); }
.mbox h3 { margin: 0 0 10px; color: var(--jet); }
.mrow { margin: 9px 0; }
/* ---------- print ---------- */
#printarea { display: none; }
@page { size: A4 landscape; margin: 8mm; }
@media print {
  body * { visibility: hidden; }
  #printarea, #printarea * { visibility: visible; }
  #printarea { display: block; position: absolute; left: 0; top: 0; width: 100%; }
  .psec { break-after: page; }
  .psec:last-child { break-after: auto; }
  .phead { display: flex; justify-content: space-between; align-items: center; border-bottom: 2.5px solid var(--jet);
    padding-bottom: 6px; margin-bottom: 8px; }
  .phead .t1 { font-size: 17px; font-weight: 800; color: var(--jet); }
  .phead .t2 { font-size: 11px; color: var(--ink-2); }
  table.pgantt { border-collapse: collapse; width: 100%; font-size: 8.5px; }
  .pgantt th, .pgantt td { border: .5px solid #B9C7CC; padding: 2px 3px; }
  .pgantt thead th { background: var(--jet) !important; color: #fff; font-size: 7.5px;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pgantt td.on { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pgantt td.acol { text-align: left; max-width: 200px; }
  .pgantt tr { break-inside: avoid; }
  .pgantt thead { display: table-header-group; }
  .plegend { font-size: 8px; margin-top: 5px; color: #333; }
}

/* --- versione portabile: salvataggio nel file, banner, chip di stato --- */
.nav .navsave { background: var(--canary); color: var(--jet); border-color: var(--canary); font-weight: 800; }
.nav .navsave:hover { filter: brightness(.96); }
.syncchip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 650;
  padding: 3px 10px; border-radius: 999px; margin-right: 6px; white-space: nowrap; }
.syncchip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.syncchip.ok { background: #E8F5E9; color: #2E7D32; } .syncchip.ok .dot { background: #2E7D32; }
.syncchip.warn { background: #FDF3E1; color: #9A6200; } .syncchip.warn .dot { background: #C77F00; }
#td-banner { max-width: 1440px; margin: 0 auto; padding: 0 22px; }
#td-banner .bnr { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 9px 14px;
  border-radius: 10px; font-size: 13px; border: 1px solid; }
#td-banner .bnr.info { background: #EDF5F7; border-color: #CFE3E8; color: #1C505E; }
#td-banner .bnr.warn { background: #FDF3E1; border-color: #F0DCB0; color: #7A5200; }
#td-banner .bnr.okk  { background: #E8F5E9; border-color: #CBE6CD; color: #2E7D32; }
#td-banner .bnr .x { margin-left: auto; cursor: pointer; border: none; background: none; font-size: 15px; color: inherit; opacity: .6; }
#td-banner .bnr .x:hover { opacity: 1; }
.revlog td { font-size: 12.5px; padding: 5px 10px; border-bottom: 1px solid var(--line); }
.revlog td.r { font-weight: 800; color: var(--teal); white-space: nowrap; }
@media print { #td-banner, .syncchip { display: none !important; } }

</style>
</head>

    if (ka !== kb) return ka - kb;
    var ea = a.ew || 0, eb = b.ew || 0;
    if (ea !== eb) return ea - eb;
    return x[1] - y[1];
  }).map(function (p) { return p[0]; });
}

function alignKey(a) {
  if (a.cid && a.cid !== 'nuova' && !a.nome) return 'c:' + a.cid;

}

}

  var map = {};

  var nAtt = 0, nTg = 0;
  STATE.targets.forEach(function (t) {

    if (touched) { nTg++; nAtt += touched; }

/* ---------------- gantt ---------------- */
var OPEN_EDIT = null;
function closingWeek(t) {

function ganttTable(t) {

  for (var w = 1; w <= W; w++) {

    var tag = w === cw ? ' ★' : '';

  }
  h += '</tr></thead><tbody>';
  /* milestone dell'operazione: Preliminare (se valorizzato) e Closing (sempre, con data) */
  function msRow(label, dstr, color) {
    if (!dstr) return '';
    var wk = weekOfDate(t, dstr);
    var r = '<tr style="background:#FFFDF2"><td class="actcol" style="background:#FFFDF2">' +
      '<div class="an" style="color:var(--jet)">◆ ' + label + ' · ' + fmtDY(new Date(dstr + 'T12:00:00')) + '</div>' +
      '<span class="stato" style="background:var(--canary);color:var(--jet)">Milestone</span></td>';
    for (var w = 1; w <= W; w++) {
      r += '<td class="wk" style="cursor:default">' + (w === wk ? '<span class="ms" style="color:' + color + ';font-size:17px">◆</span>' : '') + '</td>';
    }
    return r + '</tr>';
  }
  h += msRow(T('prelim'), t.prelim, 'var(--teal)');
  h += msRow(T('closing'), t.closing, 'var(--crit)');
  t.atts.forEach(function (a) {
    var col = PROCS[a.proc] ? PROCS[a.proc].hex : '#888';
    var wDone = a.fine ? weekOfDate(t, a.fine) : null;
    var late = wDone && a.ew && wDone > a.ew;
    h += '<tr class="' + (a.st === 2 ? 'done' : '') + '" data-aid="' + a.id + '" ondragover="dragOver(event,this)" ondrop="dragDrop(event,\'' + t.id + '\',\'' + a.id + '\')">' +
      '<td class="actcol" draggable="true" ondragstart="dragStart(event,\'' + a.id + '\')" onclick="togEdit(\'' + t.id + '\',\'' + a.id + '\')">' +
      '<div class="an"><span style="color:var(--ink-3);cursor:grab">⠿</span> <span style="color:' + col + '">●</span> ' + esc(actName(a)) + (a.ms ? ' ◆' : '') + (a.pl ? ' <span class="badge warn" style="font-size:9px">P&L</span>' : '') + '</div>' +
      '<div class="ao">' + (a.owner ? esc(a.owner) : '⚠ ' + (LANG === 'it' ? 'owner da assegnare' : 'owner to assign')) +
      ((a.support || []).length ? ' <span style="color:var(--ink-3);font-weight:500">+ ' + esc(a.support.join(', ')) + '</span>' : '') + '</div>' +
      (a.dett ? '<div class="ad">' + esc(a.dett) + '</div>' : '') +
      '<span class="stato st' + a.st + '">' + T('st' + a.st) + '</span>' +
      (a.fine ? ' <span class="stato ' + (late ? 'st3' : 'st2') + '">✓ ' + fmtDY(new Date(a.fine + 'T12:00:00')) + '</span>' : '') + '</td>';
    var barEnd = Math.max(a.ew || 0, wDone || 0);
    for (var w = 1; w <= W; w++) {

      var inbar = inPlan || inLate;
      var cls = inbar ? 'fill ' + (a.sw === barEnd ? 'startend' : w === a.sw ? 'start' : w === barEnd ? 'end' : '') : '';
      var style = inPlan ? 'background:' + col + (a.st === 2 ? '55' : '') + ';'
                : inLate ? 'background:' + col + '40;border-bottom:2.5px solid var(--crit);' : '';
      var mark = (a.ms && inPlan && w === a.sw ? '<span class="ms">◆</span>' : '') +
        (wDone && w === wDone ? '<span class="ms" style="color:' + (late ? 'var(--crit)' : 'var(--good)') + '">✓</span>' : '');
      h += '<td class="wk ' + cls + '" style="' + style + '" onclick="cellClick(\'' + t.id + '\',\'' + a.id + '\',' + w + ')">' + mark + '</td>';
    }
    h += '</tr>';
    if (OPEN_EDIT === a.id) h += editRow(t, a, W);

function importJSON(ev) {
  var f = ev.target.files[0]; if (!f) return;
  var r = new FileReader();

      try { if (applyLoaded(JSON.parse(r.result))) { DIRTY = true; STATE.page = 'cover'; render(); return; } } catch (e) {}
      tdAlert(T('importErr'));
    };
    r.readAsText(f);
  } else {
    r.onload = function () {
      try {
        var u8 = new Uint8Array(r.result), dec = new TextDecoder();
        var i = 0, found = null;
        while (i + 30 < u8.length) {
          var sig = u8[i] | (u8[i + 1] << 8) | (u8[i + 2] << 16) | (u8[i + 3] << 24);
          if ((sig >>> 0) !== 0x04034b50) break;

          var nlen = u8[i + 26] | (u8[i + 27] << 8);
          var elen = u8[i + 28] | (u8[i + 29] << 8);
          var name = dec.decode(u8.slice(i + 30, i + 30 + nlen));
          var dstart = i + 30 + nlen + elen;
          if (name.indexOf('worksheets/') >= 0) {
            var txt = dec.decode(u8.slice(dstart, dstart + csize));
            var m = txt.indexOf('TD_IPM_STATE:');
            if (m >= 0) {
              var end = txt.indexOf('</t>', m);
              var raw = txt.slice(m + 13, end).replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
              found = JSON.parse(raw);
            }
          }
          i = dstart + csize;
        }
        if (applyLoaded(found)) { DIRTY = true; STATE.page = 'cover'; render(); return; }
      } catch (e) {}
      tdAlert(T('importErr'));
    };

  }

}

  if (FLASH) h += '<div class="bnr okk">✓ ' + FLASH + '<button class="x" onclick="FLASH=\'\';render()">✕</button></div>';
  if (ART_RO && !FLASH) h += '<div class="bnr warn">🔒 ' + T('pubRO') + '</div>';
  if (BOOT_SRC && !BANNER_OFF) {
    if (BOOT_SRC === 'file') {
      var m = ensureMeta(), d = m.savedAt ? new Date(m.savedAt) : null;
      h += '<div class="bnr info">📄 ' + T('srcFile') + (m.rev ? ' · ' + T('rev') + ' ' + m.rev : '') +
        (m.savedBy ? ' · ' + esc(m.savedBy) : '') +
        (d ? ' · ' + fmtDY(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : '') +
        '<button class="x" onclick="BANNER_OFF=true;render()">✕</button></div>';
    } else {
      h += '<div class="bnr warn">⚠ ' + T(BOOT_SRC === 'localNew' ? 'srcLocalNew' : 'srcLocalOnly') +
        '<button class="x" onclick="BANNER_OFF=true;render()">✕</button></div>';
    }
  }
  el.innerHTML = h;
}
function captureBodySrc() {
  /* Sorgente canonica del corpo pagina, catturata al primo avvio (prima di qualsiasi render o iniezione esterna):
     solo gli elementi autorali, con i contenitori dinamici vuoti. */

  var parts = [];
  var hero = document.querySelector('header.hero');
  if (hero) parts.push(hero.outerHTML);
  ids.forEach(function (id) {
    var e = byId(id); if (!e) return;
    var c = e.cloneNode(true);
    if (id === 'nav' || id === 'td-banner' || id === 'main' || id === 'ownlist' || id === 'printarea') c.innerHTML = '';
    if (id === 'printmodal' || id === 'firmamodal') c.classList.remove('show');
    if (id === 'firmamodal') { var s = c.querySelector('#fm_sel'); if (s) s.innerHTML = '<option value=""></option>'; }
    parts.push(c.outerHTML);
  });
  BODY_SRC = parts.join('\n');
}
function buildFileHtml() {
  ensureMeta();
  var SC = '<' + '/script>';
  var title = (document.querySelector('title') || {}).textContent || 'Toscana Diagnostica - Integration Plan Management';
  var css = (byId('td-style') || {}).textContent || '';
  var js = (byId('td-main') || {}).textContent || '';
  var data = JSON.stringify({ v: 2, targets: STATE.targets, team: STATE.team, meta: STATE.meta }).replace(/<\//g, '<\\/');
  return '<!DOCTYPE html>\n<html lang="it">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
    '<title>' + esc(title) + '</title>\n<style id="td-style">' + css + '</style>\n</head>\n<body>\n' +
    BODY_SRC + '\n' +

    '<script id="td-main">' + js.replace(/<\/script/gi, '<\\/script') + SC + '\n' +
    '</body></html>';
}

function saveToFile() {
  var last = '';
  try { last = localStorage.getItem('td_ipm_firma') || ''; } catch (e) {}
  var opts = (STATE.team || []).map(function (m) { return m.n ? m.n + ' (' + m.r + ')' : m.r; });
  byId('fm_sel').innerHTML = '<option value=""></option>' + opts.map(function (v) {
    return '<option' + (v === last ? ' selected' : '') + '>' + esc(v) + '</option>';
  }).join('');
  byId('fm_alt').value = (last && opts.indexOf(last) < 0) ? last : '';
  byId('fm_t').textContent = T('firmaTit'); byId('fm_l1').textContent = T('firmaSel');
  byId('fm_l2').textContent = T('firmaAlt'); byId('fm_n').textContent = T('firmaNote');
  byId('fm_c').textContent = T('chiudi'); byId('fm_go').textContent = T('saveFile');
  byId('firmamodal').classList.add('show');
}
function fmGo() {
  var who = byId('fm_alt').value.trim() || byId('fm_sel').value || '';
  try { localStorage.setItem('td_ipm_firma', who); } catch (e) {}
  byId('firmamodal').classList.remove('show');
  doSaveFile(who);
}
function doSaveFile(who) {
  var m = ensureMeta(), prev = JSON.parse(JSON.stringify(m));
  m.rev = (m.rev || 0) + 1; m.savedBy = who; m.savedAt = nowIso();
  m.log = [{ rev: m.rev, by: who, at: m.savedAt }].concat(m.log).slice(0, 30);
  var html = buildFileHtml();
  var done = function (via) {
    LAST_SAVE_VIA = via;
    DIRTY = false; BOOT_SRC = ''; FLASH = (via === 'fsa' ? T('savedFsa') + ' · ' + T('rev') + ' ' + m.rev : T('savedDl'));
    save(); render();
  };
  if (ART) {
    /* Pagina pubblicata su claude.ai: la nuova versione della pagina è il salvataggio condiviso col team. */
    if (PUBLISHING) return;
    PUBLISHING = true; DIRTY = false; BOOT_SRC = ''; FLASH = T('pubBusy'); save(); render();
    ART.publish(html).then(function () {
      LAST_SAVE_VIA = 'pub'; FLASH = T('savedPub') + ' · ' + T('rev') + ' ' + m.rev; save(); render();
      /* la piattaforma ricarica tutte le viste (questa inclusa) sulla nuova versione */
    }).catch(function (e) {
      PUBLISHING = false;
      var code = e && e.code;
      if (code === 'conflict') { STATE.meta = prev; DIRTY = true; FLASH = T('pubConflict'); save(); render(); return; }
      STATE.meta = prev; DIRTY = true;
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required') { ART_RO = true; FLASH = T('pubRO'); }
      else FLASH = T('pubErr') + (e && e.message ? ' (' + e.message + ')' : '');
      save(); render();
    });
    return;
  }
  var fallback = function () {
    var blob = new Blob([html], { type: 'text/html' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    a.download = 'Toscana Diagnostica - Integration Plan Management (agg ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + p(d.getMinutes()) + ').html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    done('dl');
  };
  if (window.showSaveFilePicker) {
    var getH = FILE_HANDLE ? Promise.resolve(FILE_HANDLE) : window.showSaveFilePicker({
      suggestedName: 'Toscana Diagnostica - Integration Plan Management.html',
      types: [{ description: 'Pagina HTML', accept: { 'text/html': ['.html'] } }]
    }).then(function (h) { FILE_HANDLE = h; return h; });
    getH.then(function (h) { return h.createWritable(); })
      .then(function (w) { return w.write(html).then(function () { return w.close(); }); })
      .then(function () { done('fsa'); })
      .catch(function (e) {
        FILE_HANDLE = null;
        if (e && e.name === 'AbortError') { STATE.meta = prev; save(); render(); return; }
        fallback();
      });
  } else fallback();
}
function stateFromXlsxBytes(u8) {
  var dec = new TextDecoder(), i = 0;
  while (i + 30 < u8.length) {
    var sig = (u8[i] | (u8[i + 1] << 8) | (u8[i + 2] << 16) | (u8[i + 3] << 24)) >>> 0;
    if (sig !== 0x04034b50) break;
    var csize = u8[i + 18] | (u8[i + 19] << 8) | (u8[i + 20] << 16) | (u8[i + 21] << 24);
    var nlen = u8[i + 26] | (u8[i + 27] << 8), elen = u8[i + 28] | (u8[i + 29] << 8);
    var name = dec.decode(u8.slice(i + 30, i + 30 + nlen));
    var dstart = i + 30 + nlen + elen;
    if (name.indexOf('worksheets/') >= 0) {
      var txt = dec.decode(u8.slice(dstart, dstart + csize));
      var mk = txt.indexOf('TD_IPM_STATE:');
      if (mk >= 0) {
        var end = txt.indexOf('</t>', mk);
        var raw = txt.slice(mk + 13, end).replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
        try { return JSON.parse(raw); } catch (e) { return null; }
      }
    }
    i = dstart + csize;
  }
  return null;
}
function stateFromHtmlText(txt) {
  var m = txt.match(/id="td-embed">([\s\S]*?)<\/script>/);
  if (!m) return null;
  try { var d = JSON.parse(m[1]); return d && d.targets && d.targets.length ? d : null; } catch (e) { return null; }
}
var T_FIELDS = ['nome', 'rs', 'ind', 'piva', 'ref', 'tel', 'mail', 'web', 'pec', 'fatt', 'pfn', 'ev', 'linee', 'loi', 'prelim', 'closing', 'hor'];
var A_FIELDS = ['cid', 'nome', 'proc', 'sw', 'ew', 'owner', 'support', 'dett', 'note', 'st', 'fine', 'pl', 'ms', 'lm'];
function mergeStates(other) {
  var rep = { aU: 0, aN: 0, tN: 0, gU: 0 };
  if (!other || !other.targets) return rep;
  other.targets.forEach(function (ot) {
    (ot.atts || []).forEach(normAtt);
    var ct = STATE.targets.find(function (t) { return t.id === ot.id; });
    if (!ct) { STATE.targets.push(ot); rep.tN++; return; }
    if ((ot.lm || 0) > (ct.lm || 0)) {
      T_FIELDS.forEach(function (k) { if (ot[k] !== undefined) ct[k] = Array.isArray(ot[k]) ? ot[k].slice() : ot[k]; });
      ct.lm = ot.lm; rep.gU++;
    }
    var byIdA = {}; ct.atts.forEach(function (a) { byIdA[a.id] = a; });
    (ot.atts || []).forEach(function (oa) {
      var ca = byIdA[oa.id];
      if (!ca) { ct.atts.push(oa); rep.aN++; }
      else if ((oa.lm || 0) > (ca.lm || 0)) {
        A_FIELDS.forEach(function (k) { ca[k] = Array.isArray(oa[k]) ? oa[k].slice() : oa[k]; });
        rep.aU++;
      }
    });
  });
  (other.team || []).forEach(function (om) {
    var cm = (STATE.team || []).find(function (x) { return x.r === om.r; });
    if (!cm) STATE.team.push(om);
    else if ((om.lm || 0) > (cm.lm || 0)) { Object.keys(om).forEach(function (k) { cm[k] = om[k]; }); }
  });
  if (other.meta) {
    var m = ensureMeta(), om = other.meta;
    m.rev = Math.max(m.rev || 0, om.rev || 0);
    var seen = {};
    m.log = (m.log || []).concat(om.log || []).filter(function (e) {
      var k = (e.rev || 0) + '|' + (e.at || '') + '|' + (e.by || '');
      if (seen[k]) return false; seen[k] = 1; return true;
    }).sort(function (a, b) { return (b.at || '').localeCompare(a.at || ''); }).slice(0, 30);
  }
  if (rep.aU + rep.aN + rep.tN + rep.gU > 0) DIRTY = true;
  return rep;
}
function mergeFile(ev) {
  var f = ev.target.files[0]; if (!f) { ev.target.value = ''; return; }
  var r = new FileReader();
  r.onload = function () {
    var u8 = new Uint8Array(r.result), st = null;
    if (u8[0] === 0x50 && u8[1] === 0x4b) st = stateFromXlsxBytes(u8);
    else st = stateFromHtmlText(new TextDecoder().decode(u8));
    if (!st) { tdAlert(T('mergeErr')); return; }
    var rep = mergeStates(st);
    save(); render();
    var tot = rep.aU + rep.aN + rep.tN + rep.gU;
    FLASH = tot ? T('mergeRep').replace('{aU}', rep.aU).replace('{aN}', rep.aN).replace('{tN}', rep.tN).replace('{gU}', rep.gU) : T('mergeNo');
    render();
  };
  r.readAsArrayBuffer(f);
  ev.target.value = '';
}

function setLang(l) {

  byId('lang-it').classList.toggle('on', l === 'it');
  byId('lang-en').classList.toggle('on', l === 'en');

  byId('mrgfile').addEventListener('change', mergeFile);
  window.addEventListener('beforeunload', function (e) { if (DIRTY && !ART) { e.preventDefault(); e.returnValue = ''; } });
  render();

  try {

      window.claude.use('artifact').then(function (a) { if (a) { ART = a; render(); } });
      window.claude.use('downloads').then(function (d) { if (d) DL = d; });

}

/* ---------------- finestre di dialogo in pagina (sostituiscono alert/confirm/prompt) ---------------- */
function tdDialog(msg, opts) {
  var old = byId('tddlg'); if (old) old.remove();
  var d = document.createElement('div'); d.className = 'modal show'; d.id = 'tddlg';
  d.innerHTML = '<div class="mbox"><div class="mrow" style="white-space:pre-wrap">' + esc(msg) + '</div>' +
    (opts.input ? '<div class="mrow"><div class="fld"><input id="tddlg_in" autocomplete="off"></div></div>' : '') +
    '<div class="mrow" style="display:flex;gap:8px;justify-content:flex-end">' +
    (opts.cancel ? '<button class="btn ghost" id="tddlg_c">' + esc(T('dlgCancel')) + '</button>' : '') +
    '<button class="btn canary" id="tddlg_ok">' + esc(opts.okLabel || T('dlgOk')) + '</button></div></div>';
  document.body.appendChild(d);
  var close = function () { d.remove(); };
  var ok = function () { var v = opts.input ? (byId('tddlg_in').value || '').trim() : true; close(); if (opts.onOk) opts.onOk(v); };
  byId('tddlg_ok').onclick = ok;
  if (opts.cancel) byId('tddlg_c').onclick = function () { close(); if (opts.onCancel) opts.onCancel(); };
  if (opts.input) { var inp = byId('tddlg_in'); inp.focus(); inp.onkeydown = function (ev) { if (ev.key === 'Enter') ok(); if (ev.key === 'Escape') { close(); if (opts.onCancel) opts.onCancel(); } }; }
  else byId('tddlg_ok').focus();
}
function tdAlert(msg) { tdDialog(msg, {}); }
function tdConfirm(msg, onOk, onCancel) { tdDialog(msg, { cancel: true, okLabel: T('dlgConfirm'), onOk: onOk, onCancel: onCancel }); }
function tdPrompt(msg, onOk) { tdDialog(msg, { cancel: true, input: true, onOk: onOk }); }
